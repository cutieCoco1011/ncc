[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-comic-compiler"
version = "0.1.0"
description = "Local-first Korean prose to vertical webtoon compiler and editor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115",
  "pillow>=10.4",
  "pydantic>=2.8",
  "PyYAML>=6.0.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[project.scripts]
ncc-api = "ncc.api:run"
ncc-novelai-smoke = "ncc.real_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
